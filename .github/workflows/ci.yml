# .github/workflows/ci.yml
name: Build Resume

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'resume.md'
      - 'pandoc-templates/**'
      - '.github/workflows/ci.yml'
      - 'settings.env.txt'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'resume.md'
      - 'pandoc-templates/**'
      - '.github/workflows/ci.yml'
      - 'settings.env.txt'
  workflow_dispatch:

env:
  OUTPUT_FOLDER: ./release

jobs:
  setup-file-names:
    name: Setup environment variables
    runs-on: ubuntu-latest
    outputs:
      FILE_PDF: ${{ steps.set-names.outputs.FILE_PDF }}
      FILE_ODT: ${{ steps.set-names.outputs.FILE_ODT }}
      FILE_DOCX: ${{ steps.set-names.outputs.FILE_DOCX }}
      FILE_HTML_RICH: ${{ steps.set-names.outputs.FILE_HTML_RICH }}
      FILE_BASENAME: ${{ steps.get-vars.outputs.FILE_BASENAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create symlink from settings.env.txt to .env
        run: ln -sf settings.env.txt .env

      - name: Load environment from settings.env.txt
        uses: xom9ikk/dotenv@v2
        with:
          path: ./

      - name: Extract template variables
        id: get-vars
        run: |
          echo "FILE_BASENAME=${{ env.FILE_BASENAME }}" >> $GITHUB_OUTPUT
          echo "SHOW_TOC=${{ env.SHOW_TOC }}" >> $GITHUB_OUTPUT
          echo "DEFAULT_THEME=${{ env.DEFAULT_THEME }}" >> $GITHUB_OUTPUT

      - name: Generate file names
        id: set-names
        run: |
          echo "FILE_PDF=${{ env.OUTPUT_FOLDER }}/${{ env.FILE_BASENAME }}.pdf" >> $GITHUB_OUTPUT
          echo "FILE_ODT=${{ env.OUTPUT_FOLDER }}/${{ env.FILE_BASENAME }}.odt" >> $GITHUB_OUTPUT
          echo "FILE_DOCX=${{ env.OUTPUT_FOLDER }}/${{ env.FILE_BASENAME }}.docx" >> $GITHUB_OUTPUT
          echo "FILE_HTML_RICH=${{ env.OUTPUT_FOLDER }}/${{ env.FILE_BASENAME }}_rich.html" >> $GITHUB_OUTPUT

      - name: Validate environment variables from settings.env.txt 
        run: |
          required_vars=(
            "FILE_BASENAME"
          )
          
          missing_vars=()
          
          for var in "${required_vars[@]}"; do
            value="${!var}"
            if [ -z "$value" ]; then
              missing_vars+=("$var")
            fi
          done
          
          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "❌ ERROR: The following required variables are empty or missing:"
            printf '  - %s\n' "${missing_vars[@]}"
            echo ""
            echo "Please check your settings.env.txt file and ensure all variables are set."
            exit 1
          fi
          
          echo "✅ All required variables are present:"
          
          valid_themes=("light" "dark" "yellow")
          if [[ ! " ${valid_themes[@]} " =~ " ${DEFAULT_THEME} " ]]; then
            echo "❌ ERROR: DEFAULT_THEME '${DEFAULT_THEME}' is not valid. Must be one of: ${valid_themes[*]}"
            exit 1
          fi
          echo "✅ DEFAULT_THEME is valid: ${DEFAULT_THEME}"

  build:
    name: Build Resume
    runs-on: ubuntu-latest
    needs: setup-file-names

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: pandoc xfonts-75dpi xfonts-base xfonts-encodings xfonts-utils pandoc-data
          version: 1.0 

      - name: Cache wkhtmltopdf installer
        id: cache-wkhtml
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wkhtmltox.deb
          key: wkhtmltopdf-${{ runner.os }}-0.12.6.1-2

      - name: Download wkhtmltopdf (if not cached)
        if: steps.cache-wkhtml.outputs.cache-hit != 'true'
        run: |
          wget -q -O ${{ runner.temp }}/wkhtmltox.deb \
            https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb

      - name: Install wkhtmltopdf
        run: |
          sudo dpkg -i ${{ runner.temp }}/wkhtmltox.deb || sudo apt-get install -f -y
          wkhtmltopdf --version

      - name: Install pandoc
        run: |
          sudo apt-get install -y pandoc

      - name: Create output directory
        run: mkdir -p ${{ env.OUTPUT_FOLDER }}

      - name: Generate all documents
        run: bash build_resume.sh ${{ env.OUTPUT_FOLDER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Resume
          path: ${{ env.OUTPUT_FOLDER }}/
          retention-days: 7
          if-no-files-found: error

  test:
    name: Test generated files
    runs-on: ubuntu-latest
    needs: [setup-file-names, build]
    if: always()

    strategy:
      fail-fast: false
      matrix:
        format:
          - name: PDF
            var: FILE_PDF
            check_size: true
          - name: DOCX
            var: FILE_DOCX
            check_size: true
          - name: ODT
            var: FILE_ODT
            check_size: true
          - name: HTML (rich)
            var: FILE_HTML_RICH
            check_size: true

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Resume
          path: ${{ env.OUTPUT_FOLDER }}

      - name: Check ${{ matrix.format.name }} exists
        env:
          FILE_PATH: ${{ needs.setup-file-names.outputs[matrix.format.var] }}
        run: |
          if [ -f "${FILE_PATH}" ]; then
            echo "✅ ${{ matrix.format.name }} exists"
          else
            echo "❌ ${{ matrix.format.name }} not found"
            exit 1
          fi

      - name: Check ${{ matrix.format.name }} is not empty
        if: ${{ matrix.format.check_size == true }}
        env:
          FILE_PATH: ${{ needs.setup-file-names.outputs.FILE_PDF }}
        run: |
          if [ -s "${FILE_PATH}" ]; then
            echo "✅ ${{ matrix.format.name }} is non-empty"
          else
            echo "❌ ${{ matrix.format.name }} is empty"
            exit 1
          fi

  # The job is to update resume in GitHub Releases. 
  # It works only with manual workflow launch from 'main' branch only. 
  # Therefore you can experiment with your resume in different branches.
  upload-release:
    name: Upload to GitHub Releases
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: Resume
          path: ./release

      - name: Delete existing release (if any)
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: resume-latest
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release with latest version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resume-latest
          name: Resume (Latest)
          body: |
            Latest automatically generated resume
            
            **Build date:** ${{ github.event.repository.updated_at }}
          files: |
            ./release/*.pdf
            ./release/*.docx
            ./release/*.odt
            ./release/*_rich.html
          fail_on_unmatched_files: true

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [setup-file-names, build, test]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download rich HTML artifact
        uses: actions/download-artifact@v8
        with:
          name: Resume
          path: ${{ env.OUTPUT_FOLDER }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.OUTPUT_FOLDER }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Print Pages URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FILE_PDF: ${{ needs.setup-file-names.outputs.FILE_PDF }}
          FILE_DOCX: ${{ needs.setup-file-names.outputs.FILE_DOCX }}
          FILE_ODT: ${{ needs.setup-file-names.outputs.FILE_ODT }}
          FILE_HTML_RICH: ${{ needs.setup-file-names.outputs.FILE_HTML_RICH }}
        run: |
          echo "=========================================="
          echo "  Resume is live!"
          echo "=========================================="
          echo "  Root URL:       ${PAGE_URL}"
          echo "  Resume (HTML):  ${PAGE_URL}$(basename "${FILE_HTML_RICH}")"
          echo "  Resume (PDF):   ${PAGE_URL}$(basename "${FILE_PDF}")"
          echo "  Resume (DOCX):  ${PAGE_URL}$(basename "${FILE_DOCX}")"
          echo "  Resume (ODT):   ${PAGE_URL}$(basename "${FILE_ODT}")"
          echo "=========================================="