<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title$</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* === Theme Variables === */
        :root {
            --bg-body: #fff8e1;
            --bg-content: #fffde7;
            --bg-sidebar: #4e342e;
            --bg-sidebar-hover: #5d4037;
            --color-text: #3e2723;
            --color-heading: #3e2723;
            --color-heading-accent: #6d4c41;
            --color-link: #5d4037;
            --color-code-bg: #3e2723;
            --color-code-text: #d7ccc8;
            --color-table-bg: #fffde7;
            --color-table-header: #6d4c41;
            --color-table-header-text: #fff8e1;
            --color-table-border: #bcaaa4;
            --color-table-hover: #f5f5f5;
            --color-sidebar-text: #ecf0f1;
            --color-shadow: rgba(0, 0, 0, 0.08);
        }

        [data-theme="light"] {
            --bg-body: #f9f9f9;
            --bg-content: #fff;
            --bg-sidebar: #2c3e50;
            --bg-sidebar-hover: #34495e;
            --color-text: #333;
            --color-heading: #2c3e50;
            --color-heading-accent: #1abc9c;
            --color-link: #1abc9c;
            --color-code-bg: #2c3e50;
            --color-code-text: #ecf0f1;
            --color-table-bg: #fff;
            --color-table-header: #1abc9c;
            --color-table-header-text: #fff;
            --color-table-border: #ddd;
            --color-table-hover: #f1f1f1;
            --color-sidebar-text: #ecf0f1;
            --color-shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-content: #16213e;
            --bg-sidebar: #0f0f23;
            --bg-sidebar-hover: #1a1a3e;
            --color-text: #e0e0e0;
            --color-heading: #e0e0e0;
            --color-heading-accent: #00bcd4;
            --color-link: #4fc3f7;
            --color-code-bg: #0d1b2a;
            --color-code-text: #a8dadc;
            --color-table-bg: #16213e;
            --color-table-header: #0f3460;
            --color-table-header-text: #e0e0e0;
            --color-table-border: #2a2a4a;
            --color-table-hover: #1a1a3e;
            --color-sidebar-text: #e0e0e0;
            --color-shadow: rgba(0, 0, 0, 0.4);
        }

        /* === Base Styles === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-body);
            color: var(--color-text);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* === Sidebar === */
        #sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background-color: var(--bg-sidebar);
            color: var(--color-sidebar-text);
            padding: 20px;
            box-shadow: 2px 0 10px var(--color-shadow);
            overflow-y: auto;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
        }

        #sidebar nav {
            font-size: 0.9em;
        }

        #sidebar nav a {
            display: block;
            color: var(--color-sidebar-text);
            text-decoration: none;
            padding: 5px 0;
            transition: background-color 0.3s ease;
        }

        #sidebar nav a:hover {
            background-color: var(--bg-sidebar-hover);
            border-radius: 4px;
        }

        #sidebar nav ul {
            list-style-type: none;
            padding-left: 15px;
            margin: 0;
        }

        #sidebar nav ul ul {
            padding-left: 20px;
        }

        #sidebar nav .toc-item {
            cursor: pointer;
            position: relative;
        }

        #sidebar nav .toc-item::before {
            content: "\25B8";
            position: absolute;
            left: -15px;
            transition: transform 0.2s ease;
        }

        #sidebar nav .toc-item.active::before {
            transform: rotate(90deg);
        }

        #sidebar nav .toc-item ul {
            display: none;
        }

        #sidebar nav .toc-item.active ul {
            display: block;
        }

        /* === Content === */
        #content {
            margin-left: 290px;
            padding: 20px;
            background-color: var(--bg-content);
            min-height: 100vh;
            box-shadow: 0 0 10px var(--color-shadow);
            transition: background-color 0.3s ease, margin-left 0.3s ease;
        }

        /* === Headings === */
        h1, h2, h3 {
            color: var(--color-heading);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 2em;
            margin-top: 30px;
            margin-bottom: 15px;
            color: var(--color-heading-accent);
        }

        h3 {
            font-size: 1.5em;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* === Paragraphs === */
        p {
            margin-bottom: 15px;
        }

        /* === Tables === */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background-color: var(--color-table-bg);
            box-shadow: 0 0 5px var(--color-shadow);
            font-size: 0.9em;
            transition: background-color 0.3s ease;
        }

        table th, table td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid var(--color-table-border);
        }

        table th {
            background-color: var(--color-table-header);
            color: var(--color-table-header-text);
            font-weight: bold;
        }

        table tr:hover {
            background-color: var(--color-table-hover);
        }

        /* === Code === */
        pre {
            background-color: var(--color-code-bg);
            color: var(--color-code-text);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 15px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--color-code-bg);
            color: var(--color-code-text);
            padding: 2px 5px;
            border-radius: 3px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* === Links === */
        a {
            color: var(--color-link);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* === Theme Switcher Buttons === */
        .theme-switcher .btn {
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 0.85em;
        }

        .theme-switcher .btn.active-theme {
            box-shadow: 0 0 0 2px var(--color-heading-accent);
        }

        #sidebarToggleBtn {
            font-weight: bold;
        }

        /* === Sidebar Collapsed State === */
        body.sidebar-collapsed #sidebar {
            transform: translateX(-250px);
        }

        body.sidebar-collapsed #content {
            margin-left: 0;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            #sidebar {
                width: 100%;
                height: auto;
                position: relative;
                margin-bottom: 20px;
            }

            #content {
                margin-left: 0;
                padding: 15px;
            }

            .theme-switcher {
                top: auto;
                bottom: 15px;
                right: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Switcher & Sidebar Toggle -->
    <div class="theme-switcher btn-group" role="group" aria-label="Theme and sidebar controls" style="position: fixed; top: 15px; right: 15px; z-index: 1050;">
        <button type="button" class="btn btn-outline-secondary" id="sidebarToggleBtn">Hide TOC</button>
        <button type="button" class="btn btn-outline-secondary" data-theme-btn="light">Light</button>
        <button type="button" class="btn btn-outline-secondary" data-theme-btn="dark">Dark</button>
        <button type="button" class="btn btn-outline-secondary" data-theme-btn="yellow">Yellow</button>
    </div>

    <!-- Боковая панель -->
    <div id="sidebar">
        <nav id="toc">
            $toc$
        </nav>
    </div>

    <!-- Основной контент -->
    <div id="content">
        $body$
    </div>

    <script>
        function getStorage() {
            try { return localStorage.getItem('pandoc-theme'); } catch(e) { return null; }
        }
        function setStorage(key, value) {
            try { localStorage.setItem(key, value); } catch(e) {}
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btns = document.querySelectorAll('[data-theme-btn]');
            btns.forEach(function(btn) {
                btn.classList.remove('active-theme');
                if (btn.getAttribute('data-theme-btn') === theme) {
                    btn.classList.add('active-theme');
                }
            });
            setStorage('pandoc-theme', theme);
        }
        document.addEventListener('DOMContentLoaded', function() {
            var btns = document.querySelectorAll('[data-theme-btn]');
            btns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    setTheme(btn.getAttribute('data-theme-btn'));
                });
            });
            var initial = getStorage() || 'yellow';
            document.documentElement.setAttribute('data-theme', initial);
            btns.forEach(function(btn) {
                btn.classList.remove('active-theme');
                if (btn.getAttribute('data-theme-btn') === initial) {
                    btn.classList.add('active-theme');
                }
            });

            var sidebarBtn = document.getElementById('sidebarToggleBtn');
            var sidebarToggleStorage = getStorage('sidebar-toggle');
            if (sidebarToggleStorage === 'collapsed') {
                document.body.classList.add('sidebar-collapsed');
            }
            sidebarBtn.innerHTML = document.body.classList.contains('sidebar-collapsed') ? 'Show TOC' : 'Hide TOC';
            sidebarBtn.addEventListener('click', function() {
                document.body.classList.toggle('sidebar-collapsed');
                var isCollapsed = document.body.classList.contains('sidebar-collapsed');
                setStorage('sidebar-toggle', isCollapsed ? 'collapsed' : 'open');
                sidebarBtn.innerHTML = isCollapsed ? 'Show TOC' : 'Hide TOC';
            });
        });
    </script>
</body>
</html>
